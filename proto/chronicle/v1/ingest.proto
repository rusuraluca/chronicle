syntax = "proto3";

package chronicle.v1;

service IngestService {
  rpc IngestEvent(IngestEventRequest) returns (IngestEventResponse);
  rpc IngestEventBatch(IngestEventBatchRequest) returns (IngestEventBatchResponse);
}

message IngestEventRequest {
  string stream_id = 1;
  string event_id = 2;
  // RFC3339 timestamp
  string event_time = 3;
  // JSON object encoded as a string
  string payload_json = 4;
}

message IngestEventResponse {
  string stream_id = 1;
  int64 seq = 2;
  string event_id = 3;
  bool duplicate = 4;
  bool out_of_order = 5;
}

message IngestEventBatchRequest {
  string stream_id = 1;
  repeated IngestEventRequest events = 2;
}

message IngestEventBatchResponse {
  repeated IngestEventResponse results = 1;
}
