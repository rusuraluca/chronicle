[workspace]
resolver = "2"
members = [
    "crates/chronicle-core",
    "crates/chronicle-server",
    "crates/chronicle-cli",
]
default-members = [
    "crates/chronicle-core",
    "crates/chronicle-server",
    "crates/chronicle-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/rusuraluca/chronicle"
authors = ["Raluca Rusu"]

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.7", features = ["macros"] }
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
http = "1"
metrics = "0.24"
metrics-exporter-prometheus = "0.16"
prost = "0.13"
prost-types = "0.13"
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "uuid", "json"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tonic = "0.12"
tonic-build = "0.12"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["serde", "v4"] }
chronicle-core = { path = "crates/chronicle-core" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
